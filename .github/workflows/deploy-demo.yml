# Builds the dashboard in demo mode and publishes it to GitHub Pages on every
# push to main. The demo replays 05-visualizer/dashboard/public/demo-run.json,
# so visitors can watch the agents without installing anything.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-visualizer/dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: 05-visualizer/dashboard/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_DEMO: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: 05-visualizer/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
